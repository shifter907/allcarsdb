name = "allcarsdb-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Served at api.allcarsdb.com rather than under the Pages apex. That makes the
# API a first-class, independently addressable thing a script, a mobile app,
# or a third-party tool can call without caring that a website also exists --
# at the cost of the browser making a genuinely cross-origin request, which is
# why CORS in src/index.ts is not left wide open.
[[routes]]
pattern = "api.allcarsdb.com"
custom_domain = true

# The database is a build artifact, imported wholesale on every deploy.
# Create it once with:
#   npx wrangler d1 create allcarsdb
# then paste the returned id below.
[[d1_databases]]
binding = "DB"
database_name = "allcarsdb"
database_id = "59496c09-ccaf-4155-85b3-7c4cbb2cea2a"

[observability]
enabled = true

# Free plan gives 100k requests/day, 10ms CPU time per request, no way to
# raise either. Setting [limits] is itself a paid-plan-only feature -- Free
# accounts get a fixed cap and Wrangler rejects the config outright if you try
# to declare one. Every data response is cacheable for a day at the edge, so
# real origin traffic (the requests that actually spend CPU) is a small
# fraction of page views; revisit this once/if the project moves to a paid
# plan and wants to raise the per-request ceiling explicitly.
