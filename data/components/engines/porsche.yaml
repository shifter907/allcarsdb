# Shared Porsche engines.
#
# Defining an engine here rather than inline pays off the moment a second car
# uses it: one row, one place to fix a typo, and "every car that used this
# engine" becomes a single join. Bore, stroke and valve count belong here
# because they are properties of the casting. Power does NOT -- the same
# engine is calibrated differently per car, so output lives on the powertrain.
#
# SEED DATA -- figures approximate and uncited. See the note in
# data/vehicles/porsche/911/2026.yaml.

