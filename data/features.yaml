# Feature catalog.
#
# The curated vocabulary of equipment. Adding a feature is a reviewed change --
# that review is the only thing standing between us and forty spellings of
# "massaging seats".
#
# ---------------------------------------------------------------------------
# search_bit
# ---------------------------------------------------------------------------
# A feature with a `search_bit` is packed into the search index's 128-bit
# mask and can be filtered without a join. Bits are a scarce resource:
#
#   * Only 128 exist. Reserve them for features people genuinely filter on.
#   * NEVER change or reuse a number. The index is rebuilt from scratch every
#     time, but a stale client sending an old bit would silently match the
#     wrong feature.
#   * Everything without a bit still works -- it just resolves through the
#     variant_feature covering index instead, which is fast, only not free.
#
# Next free bit: 47
# ---------------------------------------------------------------------------

