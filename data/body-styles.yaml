# Body style catalog.
#
# A closed vocabulary, deliberately. Free-text body descriptions are the single
# biggest source of unsearchable data in every existing spec site -- "2dr Conv",
# "Convertible", "Cabriolet" and "Roadster" all mean the same thing and none of
# them match each other.
#
# `category` says what kind of vehicle it is; `roof` says how the roof works.
# Keeping them separate is what makes "hard top convertible" a real query
# instead of a category we would have to invent for every body it appears on.

body_styles:
  # --- Coupes and saloons ---------------------------------------------------
  - slug: coupe-2dr
    name: 2-Door Coupe
    category: coupe
    roof: fixed
    doors: 2
    seat_rows: 2

  - slug: coupe-2dr-2plus2
    name: 2-Door Coupe (2+2)
    category: coupe
    roof: fixed
    doors: 2
    seat_rows: 2
    notes: Vestigial rear seats; distinguished because rear legroom is not comparable to a real 2-row car.

  - slug: sedan-4dr
    name: 4-Door Sedan
    category: sedan
    roof: fixed
    doors: 4
    seat_rows: 2

  - slug: sedan-4dr-sunroof
    name: 4-Door Sedan (Panoramic Roof)
    category: sedan
    roof: panoramic_fixed
    doors: 4
    seat_rows: 2

  - slug: hatchback-3dr
    name: 3-Door Hatchback
    category: hatchback
    roof: fixed
    doors: 3
    seat_rows: 2

  - slug: hatchback-5dr
    name: 5-Door Hatchback
    category: hatchback
    roof: fixed
    doors: 5
    seat_rows: 2

  - slug: wagon-5dr
    name: 5-Door Wagon
    category: wagon
    roof: fixed
    doors: 5
    seat_rows: 2

  - slug: liftback-5dr
    name: 5-Door Liftback
    category: liftback
    roof: fixed
    doors: 5
    seat_rows: 2

  # --- Open tops ------------------------------------------------------------
  - slug: convertible-2dr-soft
    name: 2-Door Convertible (Soft Top)
    category: convertible
    roof: soft_top
    doors: 2
    seat_rows: 1

  - slug: convertible-2dr-soft-2plus2
    name: 2-Door Convertible (Soft Top, 2+2)
    category: convertible
    roof: soft_top
    doors: 2
    seat_rows: 2

  - slug: convertible-2dr-hardtop
    name: 2-Door Retractable Hardtop
    category: convertible
    roof: retractable_hardtop
    doors: 2
    seat_rows: 1
    notes: Folding metal or composite roof that stows in the body. The "hard top convertible".

  - slug: convertible-2dr-hardtop-2plus2
    name: 2-Door Retractable Hardtop (2+2)
    category: convertible
    roof: retractable_hardtop
    doors: 2
    seat_rows: 2

  - slug: convertible-4dr-soft
    name: 4-Door Convertible (Soft Top)
    category: convertible
    roof: soft_top
    doors: 4
    seat_rows: 2

  - slug: targa-2dr
    name: 2-Door Targa
    category: targa
    roof: targa
    doors: 2
    seat_rows: 2

  - slug: roadster-2dr-removable-hardtop
    name: 2-Door Roadster (Removable Hardtop)
    category: convertible
    roof: removable_hardtop
    doors: 2
    seat_rows: 1

  - slug: speedster-2dr
    name: Speedster
    category: convertible
    roof: open
    doors: 2
    seat_rows: 1

  # --- SUVs and crossovers --------------------------------------------------
  - slug: suv-5dr-2row
    name: 5-Door SUV (2 Rows)
    category: suv
    roof: fixed
    doors: 5
    seat_rows: 2

  - slug: suv-5dr-3row
    name: 5-Door SUV (3 Rows)
    category: suv
    roof: fixed
    doors: 5
    seat_rows: 3

  - slug: suv-3dr
    name: 3-Door SUV
    category: suv
    roof: fixed
    doors: 3
    seat_rows: 2

  - slug: suv-5dr-removable-top
    name: 5-Door SUV (Removable Roof)
    category: suv
    roof: removable_hardtop
    doors: 5
    seat_rows: 2
    notes: Wrangler/Bronco style.

  - slug: crossover-5dr-2row
    name: 5-Door Crossover (2 Rows)
    category: crossover
    roof: fixed
    doors: 5
    seat_rows: 2

  - slug: crossover-5dr-3row
    name: 5-Door Crossover (3 Rows)
    category: crossover
    roof: fixed
    doors: 5
    seat_rows: 3

  # --- Trucks and vans ------------------------------------------------------
  - slug: pickup-crew-short
    name: Crew Cab Pickup (Short Bed)
    category: pickup
    roof: fixed
    doors: 4
    cab: crew_cab
    bed_length_in: 67.1
    seat_rows: 2

  - slug: pickup-crew-standard
    name: Crew Cab Pickup (Standard Bed)
    category: pickup
    roof: fixed
    doors: 4
    cab: crew_cab
    bed_length_in: 79.0
    seat_rows: 2

  - slug: pickup-extended-standard
    name: Extended Cab Pickup (Standard Bed)
    category: pickup
    roof: fixed
    doors: 4
    cab: extended_cab
    bed_length_in: 79.0
    seat_rows: 2

  - slug: pickup-regular-long
    name: Regular Cab Pickup (Long Bed)
    category: pickup
