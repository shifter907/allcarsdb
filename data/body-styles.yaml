    doors: 2
    cab: regular_cab
    bed_length_in: 98.0
    seat_rows: 1

  - slug: minivan-5dr
    name: Minivan
    category: minivan
    roof: fixed
    doors: 5
    seat_rows: 3

  - slug: van-cargo
    name: Cargo Van
    category: van
    roof: fixed
    doors: 4
