name: CI

# Validation is the entire quality gate for data contributions. It must run on
# every pull request and it must block merge -- a malformed file caught in CI
# costs a reviewer nothing, and one caught after merge breaks the build for
# everyone.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ for the built-in node:sqlite module. No native builds
          # anywhere in this pipeline, which is why it runs in seconds.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate all data files
        run: npm run validate

      - name: Build the database
        run: npm run build:db

      - name: Run search verification
        run: npm run verify -w @allcarsdb/etl

      - name: Type check
        run: npm run typecheck

      - name: Report dataset size
        run: |
          echo "### Dataset" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node -e "
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync('dist/allcars.sqlite', { readOnly: true });
            const q = (s) => db.prepare(s).get();
            const r = q('SELECT COUNT(*) n, ROUND(AVG(completeness)) c FROM variant_search');
            console.log('variants:      ' + r.n);
            console.log('completeness:  ' + r.c + '%');
            console.log('makes:         ' + q('SELECT COUNT(*) n FROM make').n);
            console.log('engines:       ' + q('SELECT COUNT(*) n FROM engine').n);
            console.log('features:      ' + q('SELECT COUNT(*) n FROM feature').n);
          " >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
