- slug: porsche-rwd-standard
  name: Rear-Wheel Drive
  type: rwd
  rear_diff_type: open or electronically locking (PTV)

- slug: porsche-awd-ptm
  name: Porsche Traction Management AWD
  type: rwd_biased_awd
  marketing_name: PTM
  center_diff_type: electronically controlled multi-plate clutch
  rear_diff_type: electronically locking
  default_front_torque_pct: 0
  max_front_torque_pct: 50
  torque_vectoring: true
  disconnect_capable: true
  notes: Rear-biased. Front axle engages on demand through a clutch pack.
